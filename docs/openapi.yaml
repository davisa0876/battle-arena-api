openapi: 3.0.3
info:
  title: 'Battle Arena API'
  version: 3.1.0
  description: |-
    Phase 3+ contract: accounts, profiles, owned creatures, game rules, PvE arena battles,
    and Phase 5B.1 private PvP lobbies/invitations (no combat/XP yet).

    Authentication: web uses Sanctum cookie sessions (call `GET /sanctum/csrf-cookie` first, send
    `X-XSRF-TOKEN`, omit `device_name`). Mobile sends `device_name` and receives a bearer token.
    Localized messages follow `Accept-Language` (en, fr, pt-BR, it, es).

    Docs are maintained as Horus-style JSON fragments under `resources/docs/swagger/`.
servers:
  -
    url: 'http://localhost:8000'
    description: 'Local Compose API'
tags:
  -
    name: Auth
    description: 'Registration, login and password recovery'
  -
    name: Profile
    description: 'Trainer profile and avatar'
  -
    name: Collection
    description: 'Owned creatures, starter and acquire'
  -
    name: Game
    description: 'Published game rules and feature flags'
  -
    name: Catalog
    description: 'Public creature catalog'
  -
    name: PvE
    description: 'Solo arena battles'
  -
    name: PvP
    description: 'Private lobbies and invitations (no combat in 5B.1)'
  -
    name: Realtime
    description: 'WebSocket ticket bootstrap for the Node gateway'
paths:
  /api/register:
    post:
      tags:
        - Auth
      summary: 'Register a trainer (user + profile + level-1 progress)'
      description: 'Throttled. Without `device_name` from a stateful browser origin a cookie session is started; otherwise `device_name` is required and a token is returned.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - handle
                - email
                - password
                - password_confirmation
              properties:
                handle:
                  type: string
                  minLength: 3
                  maxLength: 24
                  pattern: '^[a-zA-Z0-9_]+$'
                  description: 'Stored lowercase; unique case-insensitively.'
                display_name:
                  type: string
                  maxLength: 64
                  nullable: true
                  description: 'Defaults to the handle.'
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: 'Must contain letters and numbers.'
                password_confirmation:
                  type: string
                device_name:
                  type: string
                  maxLength: 120
                  description: 'Required for non-browser clients.'
      responses:
        201:
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/login:
    post:
      tags:
        - Auth
      summary: 'Log in (session or token)'
      description: 'Throttled per email and IP.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_name:
                  type: string
                  maxLength: 120
                  description: 'Present for mobile clients; returns a bearer token.'
      responses:
        200:
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/logout:
    post:
      tags:
        - Auth
      summary: 'Revoke the current token or end the cookie session'
      security:
        -
          sanctum: []
      responses:
        200:
          $ref: '#/components/responses/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
  /api/forgot-password:
    post:
      tags:
        - Auth
      summary: 'Send a password reset link'
      description: 'Always answers 200 so registered emails cannot be discovered. The link targets `FRONTEND_PASSWORD_RESET_URL?token=&email=`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          $ref: '#/components/responses/Message'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/reset-password:
    post:
      tags:
        - Auth
      summary: 'Reset the password with an emailed token (revokes all tokens)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - email
                - password
                - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        200:
          $ref: '#/components/responses/Message'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/email/verify/{id}/{hash}':
    get:
      tags:
        - Auth
      summary: 'Verify an email address (signed URL from the verification email)'
      description: 'Browsers receive a redirect to `FRONTEND_EMAIL_VERIFIED_URL?status=verified`; clients sending an `Accept` header of `application/json` receive JSON.'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: hash
          in: path
          required: true
          schema:
            type: string
          description: 'sha1 of the email address.'
        -
          name: expires
          in: query
          required: true
          schema:
            type: integer
        -
          name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/Message'
        302:
          description: 'Redirect to the frontend'
        403:
          description: 'Invalid or expired link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/email/verification-notification:
    post:
      tags:
        - Auth
      summary: 'Resend the verification email'
      security:
        -
          sanctum: []
      responses:
        200:
          $ref: '#/components/responses/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/me/creatures:
    get:
      tags:
        - Collection
      summary: 'List my creatures (active first)'
      security:
        -
          sanctum: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnedCreature'
        401:
          $ref: '#/components/responses/Unauthenticated'
  '/api/me/creatures/{id}':
    get:
      tags:
        - Collection
      summary: 'Show one owned creature (owner only)'
      security:
        -
          sanctum: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnedCreature'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: 'Owned by another trainer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/me/creatures/{id}/select':
    patch:
      tags:
        - Collection
      summary: 'Make an owned creature the single active one (idempotent)'
      security:
        -
          sanctum: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnedCreature'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          description: 'Owned by another trainer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/me/starter:
    post:
      tags:
        - Collection
      summary: 'Choose the starter creature (once per trainer)'
      description: 'The slug must be one of `starters.creature_slugs` from the game rules and a stage-1 base form in the catalog.'
      security:
        -
          sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - creature_slug
              properties:
                creature_slug:
                  type: string
                  example: bulbasaur
      responses:
        201:
          description: 'Starter granted and activated'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnedCreature'
        401:
          $ref: '#/components/responses/Unauthenticated'
        409:
          description: 'A starter was already selected'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationError'
  /api/game/rules:
    get:
      tags:
        - Game
      summary: 'Versioned game rules, feature flags and XP curve'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GameRules'
  /api/me:
    get:
      tags:
        - Profile
      summary: 'Current account, profile, trainer progress and onboarding state'
      security:
        -
          sanctum: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthenticatedUser'
        401:
          $ref: '#/components/responses/Unauthenticated'
  /api/me/profile:
    patch:
      tags:
        - Profile
      summary: 'Update profile fields (all optional)'
      security:
        -
          sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                  minLength: 3
                  maxLength: 24
                  pattern: '^[a-zA-Z0-9_]+$'
                display_name:
                  type: string
                  maxLength: 64
                bio:
                  type: string
                  maxLength: 500
                  nullable: true
                collection_is_public:
                  type: boolean
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthenticatedUser'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationError'
  /api/me/password:
    patch:
      tags:
        - Profile
      summary: 'Change password (revokes other tokens)'
      security:
        -
          sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - password
                - password_confirmation
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                password_confirmation:
                  type: string
      responses:
        200:
          $ref: '#/components/responses/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationError'
  /api/me/avatar:
    post:
      tags:
        - Profile
      summary: 'Upload an avatar'
      description: 'JPG/PNG/WebP, up to 2048 KB and 32-1024 px per side. Re-encoded server side to a 512 px square; SVG is rejected. `503` when image processing is unavailable.'
      security:
        -
          sanctum: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        200:
          description: 'Updated account'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthenticatedUser'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationError'
        503:
          description: 'Image processing or storage unavailable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Profile
      summary: 'Remove the avatar'
      security:
        -
          sanctum: []
      responses:
        200:
          description: 'Updated account'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthenticatedUser'
        401:
          $ref: '#/components/responses/Unauthenticated'
  '/api/avatars/{userId}':
    get:
      tags:
        - Profile
      summary: "Stream a trainer's avatar image"
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: integer
        -
          name: v
          in: query
          required: false
          schema:
            type: string
          description: 'Cache-busting token included in `avatar_url`.'
      responses:
        200:
          description: 'Image bytes'
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: 'No avatar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/players/{handle}':
    get:
      tags:
        - Profile
      summary: 'Public trainer profile'
      description: 'Case-insensitive handle. Never includes email. `creatures` is present only when `collection_is_public` is true.'
      parameters:
        -
          name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicPlayer'
        404:
          description: 'Trainer not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pve/battles:
    post:
      tags:
        - PvE
      summary: 'Start a PvE battle'
      description: 'Starts a 1v1 PvE match with an owned creature. Any previous active battle for the trainer is forfeited.'
      security:
        -
          sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - owned_creature_id
              properties:
                owned_creature_id:
                  type: integer
                  minimum: 1
                difficulty:
                  type: string
                  enum:
                    - easy
                    - normal
                  default: normal
      responses:
        201:
          description: 'Battle started'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PveBattle'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pve/battles/{battle}':
    get:
      tags:
        - PvE
      summary: 'Get PvE battle state'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PveBattle'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          description: 'Battle not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/pve/battles/{battle}/events':
    get:
      tags:
        - PvE
      summary: 'List raw battle events'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          description: 'Battle not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/api/pve/battles/{battle}/attack':
    post:
      tags:
        - PvE
      summary: 'Submit a player attack (or recover-skip)'
      description: 'Provide exactly one of `move_id`, `basic_strike`, or `recover`. `recover` restores stamina and skips the attack when equipped moves still have PP but none are affordable.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
          description: 'Preferred idempotency header. Falls back to body `idempotency_key`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PveAttackRequest'
      responses:
        200:
          description: 'Attack resolved'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PveActionResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        409:
          description: 'Wrong phase, stale version, or idempotency conflict'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pve/battles/{battle}/defend':
    post:
      tags:
        - PvE
      summary: 'Submit a player defense'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - defense
                - expected_version
              properties:
                defense:
                  type: string
                  enum:
                    - endure
                    - block
                    - dodge
                    - recover
                    - heal
                expected_version:
                  type: integer
                  minimum: 1
                idempotency_key:
                  type: string
                  maxLength: 120
      responses:
        200:
          description: 'Defense resolved'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PveActionResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        409:
          description: 'Wrong phase, stale version, or idempotency conflict'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pve/battles/{battle}/abandon':
    post:
      tags:
        - PvE
      summary: 'Abandon (give up) the battle'
      description: 'Counts as a loss with `end_reason=abandoned`. No trainer XP is awarded.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: 'Battle abandoned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PveActionResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          description: 'Battle not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/pvp/rooms:
    post:
      tags:
        - PvP
      summary: 'Create a private PvP lobby and invite by exact handle'
      description: 'Requires trainer level >= 6. Creates a pending invitation. Idempotent via Idempotency-Key header or body idempotency_key. features.pvp remains false; no combat/XP.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invitee_handle
              properties:
                invitee_handle:
                  type: string
                  minLength: 3
                  maxLength: 24
                idempotency_key:
                  type: string
                  maxLength: 120
      responses:
        201:
          description: 'Lobby + invitation created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpCreateRoomResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/schemas/PvpError'
        409:
          $ref: '#/components/schemas/PvpError'
        422:
          $ref: '#/components/responses/ValidationError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/pvp/online:
    get:
      tags:
        - PvP
      summary: 'List online PvP-eligible opponents'
      description: 'Returns trainers currently connected to the realtime gateway, eligible for private PvP (level >= pvp_min_trainer_level), excluding the caller and players already in a committed lobby (ready) or live battle. Hosts waiting for a guest to accept stay listed — a new invite supersedes their pending room. Presence is authenticated app session + PvP level (any screen). Clients should keep a WS open via the global presence keeper. Clicking a row should call POST /api/pvp/rooms with that handle.'
      security:
        -
          sanctum: []
      responses:
        200:
          description: 'Online opponents'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpOnlineOpponentsResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/pvp/lobby:
    get:
      tags:
        - PvP
      summary: 'Current open private lobby for the authenticated trainer'
      description: 'Returns the waiting/ready/in_battle room the caller still belongs to, or data:null. Use this to rehydrate creature select after accept — invitation inbox is pending-only.'
      security:
        -
          sanctum: []
      responses:
        200:
          description: 'Current lobby or null'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/PvpRoom' }
                      - { type: 'null' }
        401:
          $ref: '#/components/responses/Unauthenticated'
  /api/pvp/invitations:
    get:
      tags:
        - PvP
      summary: 'List active pending private invitations'
      description: 'Pending only. Terminal statuses (accepted/declined/cancelled/expired) are never listed. Sent is typically at most one active invite; received may include multiple pending invites.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: box
          in: query
          required: true
          schema:
            type: string
            enum:
              - received
              - sent
      responses:
        200:
          description: 'Pending invitation list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpInvitationListResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        422:
          $ref: '#/components/responses/ValidationError'
  '/api/pvp/invitations/{invitation}/accept':
    post:
      tags:
        - PvP
      summary: 'Accept a pending invitation'
      security:
        -
          sanctum: []
      parameters:
        -
          name: invitation
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Ready lobby'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpRoomResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/schemas/PvpError'
        404:
          $ref: '#/components/schemas/PvpError'
        409:
          $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/invitations/{invitation}/decline':
    post:
      tags:
        - PvP
      summary: 'Decline a pending invitation'
      security:
        -
          sanctum: []
      parameters:
        -
          name: invitation
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Invitation declined'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/invitations/{invitation}/cancel':
    post:
      tags:
        - PvP
      summary: 'Cancel a sent pending invitation'
      security:
        -
          sanctum: []
      parameters:
        -
          name: invitation
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Invitation cancelled and lobby closed'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/rooms/{room}':
    get:
      tags:
        - PvP
      summary: 'Fetch authoritative private lobby state'
      security:
        -
          sanctum: []
      parameters:
        -
          name: room
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: 'Room state for an active member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpRoomResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
  '/api/pvp/rooms/{room}/leave':
    post:
      tags:
        - PvP
      summary: 'Leave and close a private lobby (no XP)'
      security:
        -
          sanctum: []
      parameters:
        -
          name: room
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Lobby closed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpRoomResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/rooms/{room}/subscription-grants':
    post:
      tags:
        - PvP
      summary: 'Issue a one-use WebSocket room subscription grant'
      description: 'Member-only. Redis-backed one-time grant redeemed by Node via GETDEL. Cache-Control: no-store. connection.ready alone is not room authorization.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: room
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        201:
          description: 'Grant issued'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpRoomGrantResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
        503:
          $ref: '#/components/schemas/PvpError'
  '/api/pvp/rooms/{room}/selection':
    put:
      tags:
        - PvP
      summary: 'Select (or change) an owned creature for the private lobby'
      description: 'Member-only. Requires room status ready and matching expected_room_version. Selection can change until locked via ready. features.pvp remains false; no public matchmaking.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: room
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
          description: 'Preferred idempotency header. Falls back to body `idempotency_key`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvpSelectCreatureRequest'
      responses:
        200:
          description: 'Lobby combat state with my_selection'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpLobbyCombatResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/schemas/PvpError'
        404:
          $ref: '#/components/schemas/PvpError'
        409:
          description: 'PVP_ROOM_NOT_READY, PVP_SELECTION_LOCKED, PVP_VERSION_CONFLICT, PVP_ALREADY_IN_BATTLE, etc.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        422:
          description: 'Validation or PVP_CREATURE_NOT_OWNED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/rooms/{room}/ready':
    post:
      tags:
        - PvP
      summary: 'Lock creature selection and mark ready'
      description: 'When both members are ready, starts exactly one PvP battle and returns lobby state plus actor-relative battle snapshot. features.pvp remains false; no matchmaking.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: room
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvpReadyRoomRequest'
      responses:
        200:
          description: 'Lobby combat state; includes battle when the match has started'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpLobbyCombatResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/schemas/PvpError'
        404:
          $ref: '#/components/schemas/PvpError'
        409:
          description: 'PVP_ROOM_NOT_READY, PVP_VERSION_CONFLICT, PVP_ALREADY_IN_BATTLE, etc.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        422:
          description: 'Validation or PVP_SELECTION_REQUIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/battles/{battle}':
    get:
      tags:
        - PvP
      summary: 'Get actor-relative PvP battle state'
      description: 'Participant-only. Returns viewer-relative `me` / `opponent` (opponent moves omitted). Clients rehydrate from this after missing WebSocket hints. features.pvp remains false; no matchmaking.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpBattleResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          description: 'PVP_NOT_FOUND (non-member or missing)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
  '/api/pvp/battles/{battle}/events':
    get:
      tags:
        - PvP
      summary: 'List PvP battle events after a sequence'
      description: 'Participant-only. Optional `after_sequence` query skips already-seen events (default 0). Cap 200.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpBattleEventsResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          description: PVP_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
  '/api/pvp/battles/{battle}/attack':
    post:
      tags:
        - PvP
      summary: 'Submit a PvP attack (or recover-skip)'
      description: 'Attacker-only while phase is awaiting_attack. Provide exactly one of `move_id`, `basic_strike`, or `recover`. Requires Idempotency-Key and expected_version. On 409 (PVP_WRONG_TURN / PVP_VERSION_CONFLICT / PVP_PHASE_CONFLICT / PVP_ALREADY_FINISHED), rehydrate via GET battle. features.pvp remains false; no matchmaking.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 120
          description: 'Required. Falls back to body `idempotency_key` if header omitted.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvpAttackRequest'
      responses:
        200:
          description: 'Attack committed; actor-relative battle state'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpBattleResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
        409:
          description: 'PVP_WRONG_TURN, PVP_PHASE_CONFLICT, PVP_VERSION_CONFLICT, PVP_ALREADY_FINISHED, PVP_IDEMPOTENCY_CONFLICT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        422:
          description: 'Validation, IDEMPOTENCY_REQUIRED, or PVP_INVALID_ATTACK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/battles/{battle}/forfeit':
    post:
      tags:
        - PvP
      summary: 'Explicitly forfeit an active PvP battle'
      description: 'Participant-only. Requires Idempotency-Key and expected_version. Ends the battle with end_reason=forfeit, proposed noncombat XP 0/0, and does not resolve a pending attack as combat. Room leave during active combat remains blocked. features.pvp remains false; no matchmaking.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_version
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                idempotency_key:
                  type: string
                  maxLength: 120
      responses:
        200:
          description: 'Battle forfeited; actor-relative battle + rewards'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpActionResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
        409:
          description: 'PVP_VERSION_CONFLICT, PVP_ALREADY_FINISHED, IDEMPOTENCY_CONFLICT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        422:
          description: 'Validation, IDEMPOTENCY_REQUIRED, or PVP_FORFEIT_DISABLED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/pvp/battles/{battle}/defend':
    post:
      tags:
        - PvP
      summary: 'Submit a PvP defense and resolve the exchange'
      description: 'Defender-only while phase is awaiting_defense. Requires Idempotency-Key and expected_version. Resolves damage/PP/stamina server-side; may finish the battle and include rewards. features.pvp remains false; no matchmaking.'
      security:
        -
          sanctum: []
      parameters:
        -
          name: battle
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 120
          description: 'Required. Falls back to body `idempotency_key` if header omitted.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PvpDefendRequest'
      responses:
        200:
          description: 'Defense resolved; may include rewards when the match finished'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpActionResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        404:
          $ref: '#/components/schemas/PvpError'
        409:
          description: 'PVP_WRONG_TURN, PVP_PHASE_CONFLICT, PVP_VERSION_CONFLICT, PVP_ALREADY_FINISHED, PVP_IDEMPOTENCY_CONFLICT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        422:
          description: 'Validation, IDEMPOTENCY_REQUIRED, or PVP_INVALID_DEFENSE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvpError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /api/realtime/tickets:
    post:
      tags:
        - Realtime
      summary: 'Issue a one-time WebSocket authentication ticket'
      description: 'Requires Sanctum (web cookie session or mobile bearer). Returns a short-lived single-use ticket for upgrading to the Node.js gateway. Never put Sanctum credentials in WebSocket URLs. Cache-Control: no-store.'
      security:
        -
          sanctum: []
      responses:
        201:
          description: 'Ticket issued'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicketResponse'
        401:
          $ref: '#/components/responses/Unauthenticated'
        429:
          $ref: '#/components/responses/TooManyRequests'
        503:
          description: 'Ticket store (Redis) unavailable'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
components:
  schemas:
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        profile:
          type: object
          nullable: true
          properties:
            handle:
              type: string
            display_name:
              type: string
            bio:
              type: string
              nullable: true
            avatar_url:
              type: string
              nullable: true
            collection_is_public:
              type: boolean
        trainer:
          $ref: '#/components/schemas/TrainerProgress'
        onboarding:
          type: object
          properties:
            starter_selected:
              type: boolean
        created_at:
          type: string
          format: date-time
    AuthenticatedUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthenticatedUser'
        meta:
          type: object
          properties:
            auth_mode:
              type: string
              enum:
                - session
                - token
            token:
              type: string
              description: 'Only when auth_mode is token.'
            token_type:
              type: string
              example: Bearer
    TrainerProgress:
      type: object
      properties:
        level:
          type: integer
        total_xp:
          type: integer
        xp_into_level:
          type: integer
        xp_for_next_level:
          type: integer
          nullable: true
        xp_to_next_level:
          type: integer
          nullable: true
        progress_percent:
          type: number
        is_max_level:
          type: boolean
    OwnedCreature:
      type: object
      properties:
        id:
          type: integer
        level:
          type: integer
        total_xp:
          type: integer
        is_active:
          type: boolean
        acquired_at:
          type: string
          format: date-time
        creature:
          type: object
          description: 'Catalog creature with id/name/slug/image_url/types/base_stats.'
        evolution:
          type: object
          properties:
            execution_enabled:
              type: boolean
            options:
              type: array
              items:
                $ref: '#/components/schemas/EvolutionOption'
    EvolutionOption:
      type: object
      properties:
        creature:
          type: object
          description: 'Same shape as a catalog creature.'
        eligible:
          type: boolean
        locked:
          type: boolean
        reason_code:
          type: string
          example: requirements_not_defined
        reason:
          type: string
          description: Localized.
    Error:
      type: object
      properties:
        message:
          type: string
    GameRules:
      type: object
      properties:
        rules_version:
          type: string
          example: 3.0.0
        features:
          type: object
          additionalProperties:
            type: boolean
        progression:
          type: object
          properties:
            xp_base:
              type: integer
            xp_growth:
              type: number
            max_level:
              type: integer
            formula:
              type: string
            curve:
              type: array
              items:
                type: object
                properties:
                  level:
                    type: integer
                  xp_to_advance:
                    type: integer
                  total_xp_required:
                    type: integer
        starters:
          type: object
          properties:
            creature_slugs:
              type: array
              items:
                type: string
        avatar:
          type: object
          properties:
            max_upload_kb:
              type: integer
            max_dimension:
              type: integer
            output_dimension:
              type: integer
            allowed_mime_types:
              type: array
              items:
                type: string
        battle:
          type: object
          properties:
            pve_min_trainer_level:
              type: integer
              example: 1
            pvp_min_trainer_level:
              type: integer
              example: 6
            pvp_online_presence:
              type: object
              description: 'How trainers appear in GET /api/pvp/online. Authenticated + PvP level; not limited to the PvP lobby screen.'
              properties:
                while_authenticated:
                  type: boolean
                  example: true
                requires_pvp_min_level:
                  type: boolean
                  example: true
                requires_pvp_screen:
                  type: boolean
                  example: false
            playable:
              type: boolean
            rewards:
              type: object
              properties:
                pve:
                  type: object
                  properties:
                    win:
                      type: integer
                    loss:
                      type: integer
                pvp:
                  type: object
                  properties:
                    win:
                      type: integer
                    loss:
                      type: integer
    PublicPlayer:
      type: object
      properties:
        handle:
          type: string
        display_name:
          type: string
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        collection_is_public:
          type: boolean
        trainer:
          $ref: '#/components/schemas/TrainerProgress'
        creatures:
          type: array
          description: 'Only present when the collection is public.'
          items:
            $ref: '#/components/schemas/OwnedCreature'
    PveAttackRequest:
      type: object
      required:
        - expected_version
      properties:
        move_id:
          type: integer
          minimum: 1
          nullable: true
        basic_strike:
          type: boolean
          description: 'Only when no equipped move has PP left.'
        recover:
          type: boolean
          description: 'Recover +15 stamina and skip the attack when moves still have PP but none are affordable.'
        expected_version:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          maxLength: 120
      description: 'Provide exactly one of move_id, basic_strike, or recover.'
    PveRecord:
      type: object
      properties:
        wins:
          type: integer
        losses:
          type: integer
        give_ups:
          type: integer
    PveReward:
      type: object
      nullable: true
      properties:
        xp_awarded:
          type: integer
        trainer_levels_gained:
          type: integer
        duplicate:
          type: boolean
    PveResourceBar:
      type: object
      properties:
        current:
          type: integer
        max:
          type: integer
    PveBattleMove:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        slug:
          type: string
        name:
          type: string
        power:
          type: integer
        accuracy:
          type: integer
        type:
          type: string
        damage_class:
          type: string
        pp:
          $ref: '#/components/schemas/PveResourceBar'
        stamina_cost:
          type: integer
        can_use:
          type: boolean
    PveCombatant:
      type: object
      properties:
        owned_creature_id:
          type: integer
          nullable: true
        name:
          type: string
        slug:
          type: string
        image_ref:
          type: string
          nullable: true
        cry_latest_url:
          type: string
          nullable: true
        cry_legacy_url:
          type: string
          nullable: true
        cry_url:
          type: string
          nullable: true
        level:
          type: integer
        types:
          type: array
          items:
            type: string
        hp:
          $ref: '#/components/schemas/PveResourceBar'
        stamina:
          $ref: '#/components/schemas/PveResourceBar'
        moves:
          type: array
          items:
            $ref: '#/components/schemas/PveBattleMove'
        intent:
          type: object
          nullable: true
          properties:
            type_slug:
              type: string
            damage_class:
              type: string
            is_basic_strike:
              type: boolean
    PveBattle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
            - pve
        status:
          type: string
        phase:
          type: string
          enum:
            - awaiting_player_attack
            - awaiting_player_defense
            - finished
        round:
          type: integer
        version:
          type: integer
        rules_version:
          type: string
        difficulty:
          type: string
        outcome:
          type: string
          enum:
            - win
            - loss
          nullable: true
        end_reason:
          type: string
          enum:
            - combat
            - abandoned
          nullable: true
        player:
          $ref: '#/components/schemas/PveCombatant'
        opponent:
          $ref: '#/components/schemas/PveCombatant'
        allowed_actions:
          type: array
          items:
            type: string
            enum:
              - attack
              - defend
              - recover
        last_event_sequence:
          type: integer
        combat_log:
          type: array
          items:
            type: object
        record:
          $ref: '#/components/schemas/PveRecord'
        reward:
          $ref: '#/components/schemas/PveReward'
    PveActionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            battle:
              $ref: '#/components/schemas/PveBattle'
            events:
              type: array
              items:
                type: object
            reward:
              $ref: '#/components/schemas/PveReward'
    PvpError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
          description: 'Stable machine code. Combat examples: PVP_WRONG_TURN, PVP_PHASE_CONFLICT, PVP_VERSION_CONFLICT, PVP_ALREADY_FINISHED, PVP_ROOM_NOT_READY, PVP_SELECTION_LOCKED, PVP_ALREADY_IN_BATTLE, PVP_CREATURE_NOT_OWNED, PVP_SELECTION_REQUIRED, PVP_IDEMPOTENCY_CONFLICT, IDEMPOTENCY_REQUIRED.'
          enum:
            - PVP_NOT_FOUND
            - PVP_FORBIDDEN
            - PVP_NOT_ELIGIBLE
            - PVP_SELF_INVITE
            - PVP_INVITEE_UNAVAILABLE
            - PVP_ALREADY_IN_LOBBY
            - PVP_INVITE_NOT_PENDING
            - PVP_INVITE_EXPIRED
            - PVP_ROOM_CLOSED
            - PVP_IDEMPOTENCY_CONFLICT
            - PVP_GRANT_UNAVAILABLE
            - PVP_ALREADY_IN_BATTLE
            - PVP_ROOM_NOT_READY
            - PVP_SELECTION_LOCKED
            - PVP_WRONG_TURN
            - PVP_PHASE_CONFLICT
            - PVP_VERSION_CONFLICT
            - PVP_ALREADY_FINISHED
            - PVP_CREATURE_NOT_OWNED
            - PVP_SELECTION_REQUIRED
            - PVP_INVALID_ATTACK
            - PVP_INVALID_DEFENSE
            - IDEMPOTENCY_REQUIRED
    PvpPublicPlayer:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        handle:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
    PvpInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        status:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        inviter:
          $ref: '#/components/schemas/PvpPublicPlayer'
        invitee:
          $ref: '#/components/schemas/PvpPublicPlayer'
        allowed_actions:
          type: array
          items:
            type: string
    PvpRoom:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        version:
          type: integer
        closed_reason:
          type: string
          nullable: true
        host:
          $ref: '#/components/schemas/PvpPublicPlayer'
        members:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: integer
              role:
                type: string
              joined_at:
                type: string
                format: date-time
                nullable: true
              player:
                $ref: '#/components/schemas/PvpPublicPlayer'
        invitation:
          $ref: '#/components/schemas/PvpInvitation'
        allowed_actions:
          type: array
          items:
            type: string
        phase_note:
          type: string
    PvpCreateRoomResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            room:
              $ref: '#/components/schemas/PvpRoom'
            invitation:
              $ref: '#/components/schemas/PvpInvitation'
    PvpRoomResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PvpRoom'
    PvpInvitationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PvpInvitation'
    PvpOnlineOpponent:
      type: object
      required:
        - id
        - handle
        - level
      properties:
        id:
          type: integer
        handle:
          type: string
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        level:
          type: integer
    PvpOnlineOpponentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PvpOnlineOpponent'
    PvpRoomGrantResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - grant
            - expires_in
            - room_id
          properties:
            grant:
              type: string
            expires_in:
              type: integer
              example: 30
            room_id:
              type: string
              format: uuid
    PvpResourceBar:
      type: object
      properties:
        current:
          type: integer
        max:
          type: integer
    PvpBattleMove:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        slot:
          type: integer
        slug:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        power:
          type: integer
          nullable: true
        accuracy:
          type: integer
          nullable: true
        type_slug:
          type: string
          nullable: true
        damage_class:
          type: string
          nullable: true
        pp:
          $ref: '#/components/schemas/PvpResourceBar'
        stamina_cost:
          type: integer
        can_use:
          type: boolean
    PvpCombatant:
      type: object
      nullable: true
      description: 'Actor-relative combatant. Moves are included only on `me`, never on `opponent`.'
      properties:
        user_id:
          type: integer
        name:
          type: string
        slug:
          type: string
        level:
          type: integer
        types:
          type: array
          items:
            type: string
        hp:
          $ref: '#/components/schemas/PvpResourceBar'
        stamina:
          $ref: '#/components/schemas/PvpResourceBar'
        stats:
          type: object
          additionalProperties: true
        moves:
          type: array
          items:
            $ref: '#/components/schemas/PvpBattleMove'
          description: 'Present only for the viewing actor (`me`).'
    PvpPendingAttack:
      type: object
      nullable: true
      description: 'Committed attack summary visible to the defender. No damage/HP/RNG secrets.'
      properties:
        move_name:
          type: string
          nullable: true
        move_slug:
          type: string
          nullable: true
        is_basic_strike:
          type: boolean
    PvpBattleOutcome:
      type: object
      nullable: true
      properties:
        winner_user_id:
          type: integer
          nullable: true
        loser_user_id:
          type: integer
          nullable: true
        end_reason:
          type: string
          nullable: true
          example: combat
    PvpBattle:
      type: object
      description: 'Authoritative actor-relative PvP battle snapshot. `me` / `opponent` are viewer-relative.'
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
            - pvp
        phase:
          type: string
          enum:
            - awaiting_attack
            - awaiting_defense
            - finished
        status:
          type: string
          enum:
            - active
            - finished
        version:
          type: integer
        turn_number:
          type: integer
        rules_version:
          type: string
        current_attacker_user_id:
          type: integer
        current_defender_user_id:
          type: integer
        pending_attack:
          $ref: '#/components/schemas/PvpPendingAttack'
        me:
          $ref: '#/components/schemas/PvpCombatant'
        opponent:
          $ref: '#/components/schemas/PvpCombatant'
        allowed_actions:
          type: array
          items:
            type: string
        last_event_sequence:
          type: integer
        outcome:
          $ref: '#/components/schemas/PvpBattleOutcome'
    PvpBattleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PvpBattle'
    PvpBattleEvent:
      type: object
      properties:
        sequence:
          type: integer
        type:
          type: string
        actor:
          type: string
          nullable: true
        target:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
          nullable: true
    PvpBattleEventsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PvpBattleEvent'
    PvpLobbyCombatState:
      type: object
      description: 'Room state during creature selection / ready. Opponent selection stays hidden until both are locked.'
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        version:
          type: integer
        my_selection:
          type: object
          nullable: true
          properties:
            owned_creature_id:
              type: integer
            locked:
              type: boolean
        selections_revealed:
          type: array
          nullable: true
          items:
            type: object
            properties:
              user_id:
                type: integer
              owned_creature_id:
                type: integer
              locked:
                type: boolean
        battle_id:
          type: string
          format: uuid
          nullable: true
        battle:
          $ref: '#/components/schemas/PvpBattle'
        phase_note:
          type: string
    PvpLobbyCombatResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PvpLobbyCombatState'
    PvpSelectCreatureRequest:
      type: object
      required:
        - owned_creature_id
        - expected_room_version
      properties:
        owned_creature_id:
          type: integer
          minimum: 1
        expected_room_version:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          maxLength: 120
    PvpReadyRoomRequest:
      type: object
      required:
        - expected_room_version
      properties:
        expected_room_version:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          maxLength: 120
    PvpAttackRequest:
      type: object
      required:
        - expected_version
      properties:
        move_id:
          type: integer
          minimum: 1
          nullable: true
        basic_strike:
          type: boolean
          description: 'Only when no equipped move has PP left.'
        recover:
          type: boolean
          description: 'Recover stamina and skip the attack when moves still have PP but none are affordable.'
        expected_version:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          maxLength: 120
      description: 'Provide exactly one of move_id, basic_strike, or recover. Idempotency-Key header (or body idempotency_key) is required.'
    PvpDefendRequest:
      type: object
      required:
        - defense
        - expected_version
      properties:
        defense:
          type: string
          enum:
            - endure
            - block
            - dodge
            - recover
            - heal
        expected_version:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
          maxLength: 120
      description: 'Idempotency-Key header (or body idempotency_key) is required.'
    PvpRewardRow:
      type: object
      properties:
        user_id:
          type: integer
        outcome:
          type: string
          enum:
            - win
            - loss
        xp_awarded:
          type: integer
    PvpActionResponse:
      type: object
      properties:
        data:
          oneOf:
            -
              $ref: '#/components/schemas/PvpBattle'
            -
              type: object
              properties:
                battle:
                  $ref: '#/components/schemas/PvpBattle'
                rewards:
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/PvpRewardRow'
    RealtimeTicketResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - ticket
            - expires_in
            - ws_url
          properties:
            ticket:
              type: string
              description: 'Opaque single-use secret. Present once; never logged.'
            expires_in:
              type: integer
              example: 30
              description: 'Seconds until the ticket expires if unused.'
            ws_url:
              type: string
              example: 'ws://localhost:3001/ws'
              description: 'Public WebSocket URL for clients (not the Compose hostname).'
  responses:
    Message:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 'Authentication required'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 'Validation failed'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    TooManyRequests:
      description: 'Rate limit exceeded'
  parameters: []
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: 'Sanctum personal access token (mobile). Web uses the session cookie instead.'
security: []
