name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and style (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Tests use SQLite :memory: from phpunit.xml, so no Postgres/Redis service is required.
      # The throwaway key below is generated per CI run only; no secrets are used.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # TODO: the codebase currently has pre-existing Pint style violations (10 files).
      # Run `vendor/bin/pint` once, commit, then remove `continue-on-error` to enforce it.
      - name: Check code style (Pint)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Run tests
        run: php artisan test
